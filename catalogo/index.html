<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutosa · Pulpagro — Product Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{--g:#1f6f2e;--g2:#57a83a;--o:#f59e0b;--o2:#ea580c;--ink:#1c2b1f;--mut:#667085;--bg:#f5f8f1;--card:#fff;--line:#e3e9dc}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:inherit}button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* HERO */
.hero{position:relative;color:#fff;background:linear-gradient(135deg,#0f4d1c,#2f8a34 55%,#f59e0b);background-size:cover;background-position:center;padding:56px 0 70px;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.hero:before{width:380px;height:380px;right:-110px;top:-120px;background:rgba(255,255,255,.10)}
.hero:after{width:240px;height:240px;left:-80px;bottom:-110px;background:rgba(245,158,11,.25)}
.hero .wrap{position:relative;z-index:1;text-align:center}
.eyebrow{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.hero h1{margin:16px 0 8px;font-size:clamp(30px,5.5vw,58px);line-height:1.08;font-weight:800;letter-spacing:-.5px}
.hero p.sub{margin:0 auto;max-width:640px;font-size:clamp(15px,2vw,18px);opacity:.95}
.cocards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px;text-align:left}
.cocard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:block;background:rgba(255,255,255,.96);color:var(--ink);border-radius:22px;padding:20px 22px;border-top:6px solid var(--c);box-shadow:0 14px 40px rgba(0,0,0,.22);transition:.2s}
.cocard:hover{transform:translateY(-5px)}
.cocard .top{display:flex;align-items:center;gap:14px}
.cocard img.lg{height:54px;max-width:120px;object-fit:contain}
.cocard h2{margin:0;font-size:24px;color:var(--c)}
.cocard .tag{font-size:13px;color:var(--mut)}
.cocard .meta{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.cocard .meta b{background:var(--c);color:#fff;border-radius:999px;padding:3px 12px}
.cocard .meta span{color:var(--c)}
.cocard .minis{margin-top:12px}
/* SECCIONES */
section.s{padding:52px 0 8px}
.stitle{text-align:center;margin-bottom:26px}
.stitle h2{margin:0;font-size:clamp(24px,3.6vw,36px);font-weight:800}
.stitle h2 span{background:linear-gradient(90deg,var(--g),var(--o2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stitle p{margin:8px auto 0;max-width:680px;color:var(--mut)}
.certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cocol{background:var(--card);border-radius:22px;padding:22px;border:1px solid var(--line);border-top:6px solid var(--c);box-shadow:0 8px 28px rgba(30,60,20,.08);position:relative}
.cohead{display:flex;align-items:center;gap:14px;margin-bottom:16px;border-radius:14px}
.cohead img{height:50px;max-width:110px;object-fit:contain}
.cohead h3{margin:0;font-size:22px;color:var(--c)}
.cohead p{margin:0;font-size:13px;color:var(--mut)}
.cohead .count{margin-left:auto;background:var(--c);color:#fff;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700;white-space:nowrap}
.logos{display:flex;flex-wrap:wrap;gap:10px}
.clogo{width:96px;text-align:center;text-decoration:none;border-radius:14px;padding:8px 4px;position:relative;border:1px solid transparent;transition:.15s}
a.clogo:hover,.clogo.editable:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:0 8px 18px rgba(0,0,0,.1);background:#fff}
.clogo .im{height:58px;display:flex;align-items:center;justify-content:center}
.clogo img{max-width:100%;max-height:58px;object-fit:contain}
.clogo span{display:block;font-size:11px;color:var(--mut);margin-top:4px;line-height:1.15}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:54px;border-radius:12px;background:repeating-linear-gradient(45deg,#f1f5ec,#f1f5ec 8px,#e7eedf 8px,#e7eedf 16px);color:#8a9a7b;font-size:11px;font-weight:600;text-align:center;padding:4px}
.empty{color:var(--mut);font-size:14px;font-style:italic;padding:16px 4px;text-align:center;grid-column:1/-1}
/* CATALOGO */
.tb{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-bottom:24px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--o)}
.pill.on{background:linear-gradient(135deg,var(--o),var(--o2));border-color:transparent;color:#fff}
#q{padding:9px 16px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:14px;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{position:relative;background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 22px rgba(30,60,20,.07);cursor:pointer;transition:.22s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(30,60,20,.16)}
.cimg{position:relative;aspect-ratio:4/3;background:#eef3e8;overflow:hidden}
.cimg>img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}
.card:hover .cimg>img{transform:scale(1.07)}
.cimg .ph{border-radius:0;font-size:14px}
.cobs{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.cobadge{background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:700;letter-spacing:.3px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ccat{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--o2)}
.card h3{margin:0;font-size:18px;line-height:1.25}
.ctag{font-size:12.5px;color:var(--mut)}
.minis{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.mc{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 5px;border-radius:9px;background:#fff;border:1.5px solid var(--c);font-size:9px;font-weight:700;color:var(--c)}
.mc img{max-height:22px;max-width:40px;object-fit:contain}
.mc.more{border-color:var(--line);color:var(--mut)}
.more-l{margin-top:auto;padding-top:8px;font-size:13px;font-weight:700;color:var(--g)}
/* MODAL PRODUCTO */
.pov{position:fixed;inset:0;background:rgba(10,30,14,.65);backdrop-filter:blur(4px);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.pm{background:#fff;border-radius:26px;max-width:940px;width:100%;max-height:94vh;overflow:auto;display:grid;grid-template-columns:1fr 1.1fr;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.pm .pi{background:#eef3e8;min-height:320px;position:relative}
.pm .pi img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.pm .pi .ph{position:absolute;inset:0;border-radius:0;font-size:16px}
.pm .pc{padding:26px 26px 24px}
.pm h2{margin:8px 0 4px;font-size:28px;line-height:1.15}
.pm .x{position:absolute;right:12px;top:10px;z-index:3;border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pm .cobs{position:static;margin-bottom:4px}
.pm .desc{white-space:pre-line;color:#3b4a3e;margin:10px 0}
.pm h4{margin:18px 0 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--g)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.specs dt{font-weight:700;color:var(--mut)}.specs dd{margin:0}
.specs .full{grid-column:1/-1}
.cgrp{margin-bottom:10px;padding:10px 12px;border-radius:14px;background:#f8faf5;border-left:5px solid var(--c)}
.cgrp b{display:block;font-size:12px;color:var(--c);margin-bottom:6px}
.cgrp .logos{gap:6px}.cgrp .clogo{width:78px;padding:4px 2px}.cgrp .clogo .im{height:42px}.cgrp .clogo img{max-height:42px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff7e6;border:1px solid #fde2a7;font-size:13px;font-weight:600;text-decoration:none;color:#b45309}
a.chip:hover{background:var(--o);color:#fff}
a.chip:after{content:"↗";font-size:11px}
.quote{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
.quote span{font-weight:700;margin-right:auto}
.qb{padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;color:#fff}
.qb.wa{background:#25a244}.qb.mail{background:linear-gradient(135deg,var(--o),var(--o2))}
/* FOOTER */
footer.ft{margin-top:56px;background:#10341a;color:#d9ead3;padding:34px 0;text-align:center}
footer.ft .cts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
footer.ft .qb{background:rgba(255,255,255,.14)}
footer.ft .qb.wa{background:#25a244}
.pdfview{display:none}
/* BARRA EDITOR */
.bar{position:sticky;top:0;z-index:120;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar b{color:var(--g);margin-right:auto}
.btn{border:0;border-radius:10px;padding:8px 14px;font:600 13px Poppins,sans-serif;cursor:pointer;background:#eef2ea;color:var(--ink)}
.btn:hover{filter:brightness(.95)}
.btn.pri{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}
.btn.org{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff}
.btn.dan{background:#fee2e2;color:#b91c1c}
.btn.on{background:#111827;color:#fff}
.editing .editable{outline:2px dashed transparent;outline-offset:2px}
.editing .editable:hover{outline-color:var(--o)}
.ctl{display:none;position:absolute;top:6px;right:6px;z-index:6;gap:2px;background:#111827;border-radius:8px;padding:2px}
.editing .editable:hover>.ctl,.editing .editable:hover .ctl:first-of-type{display:flex}
.ctl button{border:0;background:none;color:#fff;cursor:pointer;padding:2px 6px;font-size:13px}
.ctl button:hover{color:var(--o)}
.addbar{display:none;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.editing .addbar{display:flex}
.add{border:2px dashed #b9cfa6;background:#fbfdf8;color:var(--g);border-radius:12px;padding:8px 16px;font-weight:600;cursor:pointer}
.add:hover{background:#eef6e8}
.editonly{display:none}.editing .editonly{display:inline-block}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:Poppins,sans-serif}
.modal h3{margin:0 0 6px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.modal input[type=text],.modal input[type=url],.modal select,.modal textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:10px;font:inherit;font-size:14px}
.modal textarea{min-height:84px;resize:vertical}
.modal input[type=color]{width:60px;height:38px;border:0;padding:0;background:none}
.modal .row{display:flex;gap:6px;margin-bottom:6px}.modal .row input{flex:1}
.modal .imgp{height:110px;border:1px dashed #c7d2bf;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fafcf7;overflow:hidden}
.modal .imgp img{max-width:100%;max-height:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.modal .chk b{font-size:11px;color:#fff;border-radius:999px;padding:1px 8px}
.qrbox{text-align:center}.qrbox img{width:240px;height:240px;image-rendering:pixelated}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;z-index:300;font-size:14px}
@media(max-width:760px){.cocards,.certs{grid-template-columns:1fr}.pm{grid-template-columns:1fr}.pm .pi{min-height:220px}.cohead .count{display:none}}
/* IMPRESION / PDF */
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}.bar,.interactive,.ctl,.addbar,.pov,.editonly{display:none!important}
 .hero{padding:26px 0 30px}.cocard{box-shadow:none;border:1px solid #ddd;border-top:6px solid var(--c)}
 .cocol,.pc{break-inside:avoid;box-shadow:none}
 section.s{padding-top:24px}
 .pdfview{display:block}
 .pdfview h2.cat{margin:26px 0 12px;font-size:20px;color:var(--g);border-bottom:3px solid var(--o);padding-bottom:4px;break-after:avoid}
 .pdfgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .pc{display:grid;grid-template-columns:120px 1fr;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
 .pci{position:relative;min-height:100px;border-radius:10px;overflow:hidden;background:#eef3e8}
 .pci img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
 .pc h4{margin:4px 0;font-size:15px}.pc p{margin:2px 0;font-size:11px;color:#444}
 .pc .cobs{position:static}.pc .logos{gap:4px}.pc .clogo{width:60px;padding:2px}.pc .clogo .im{height:32px}.pc .clogo img{max-height:32px}.pc .clogo span{font-size:8px}
 .pc .chip{padding:2px 8px;font-size:10px}
 footer.ft{margin-top:20px}
}
</style>
</head>
<body>
<div id="bar" class="bar"></div>
<div id="app"></div>
<script id="viewjs">
/* ===== VISTA DEL CATÁLOGO (se incluye tal cual en la web exportada) ===== */
var editing=false,F={co:'all',cat:'all',q:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=(u||'').trim();if(!u)return'';return /^(https?:|mailto:)/i.test(u)?u:(/^[\w.-]+\.[a-z]{2,}/i.test(u)?'https://'+u:'')}
function ph(t){return '<div class="ph">'+esc(t)+'</div>'}
function im(src,t){return src?'<img src="'+esc(src)+'" alt="'+esc(t)+'" loading="lazy">':ph(t)}
function findCert(id){for(var i=0;i<S.cos.length;i++){var k=S.cos[i].certs.find(function(x){return x.id===id});if(k)return{cert:k,co:S.cos[i]}}return null}
function pcos(p){return p.co==='both'?S.cos:S.cos.filter(function(c){return c.id===p.co})}
function pcerts(p){return(p.certs||[]).map(findCert).filter(Boolean)}
function nc(n){return n+(n===1?' certification':' certifications')}
function badge(c){return '<span class="cobadge" style="--c:'+esc(c.color)+'">'+esc(c.name)+'</span>'}
function ctl(path){return editing?'<div class="ctl"><button data-a="l" data-p="'+path+'" title="Move back">◀</button><button data-a="r" data-p="'+path+'" title="Move forward">▶</button><button data-a="d" data-p="'+path+'" title="Delete">✕</button></div>':''}
function minis(p){var cs=pcerts(p);if(!cs.length)return'';
 return '<div class="minis">'+cs.slice(0,6).map(function(x){return '<span class="mc" title="'+esc(x.cert.name)+' · '+esc(x.co.name)+'" style="--c:'+esc(x.co.color)+'">'+(x.cert.img?'<img src="'+esc(x.cert.img)+'" alt="">':esc(x.cert.name.slice(0,5)))+'</span>'}).join('')+(cs.length>6?'<span class="mc more">+'+(cs.length-6)+'</span>':'')+'</div>'}
function logoLink(x){var u=safeUrl(x.cert.url),b='<div class="im">'+im(x.cert.img,x.cert.name)+'</div><span>'+esc(x.cert.name)+'</span>';
 return u?'<a class="clogo" href="'+esc(u)+'" target="_blank" rel="noopener" title="View certificate">'+b+'</a>':'<div class="clogo">'+b+'</div>'}
function filtered(){var q=F.q.trim().toLowerCase();
 return S.products.map(function(p,i){return{p:p,i:i}}).filter(function(o){var p=o.p;
  return(F.co==='all'||p.co===F.co||p.co==='both')&&(F.cat==='all'||p.cat===F.cat)&&(!q||[p.name,p.cat,p.tags,p.desc].join(' ').toLowerCase().indexOf(q)>-1)})}
function card(p,i){
 return '<article class="card '+(editing?'editable':'')+'" '+(editing?'data-e="p'+i+'" ':'')+'data-v="open" data-i="'+i+'"><div class="cimg">'+im(p.img,p.name)+'<div class="cobs">'+pcos(p).map(badge).join('')+'</div></div><div class="cbody"><div class="ccat">'+esc(p.cat)+'</div><h3>'+esc(p.name)+'</h3>'+(p.tags?'<div class="ctag">'+esc(p.tags)+'</div>':'')+minis(p)+'<div class="more-l">View details →</div></div>'+ctl('p'+i)+'</article>'}
function gridHTML(){var l=filtered();return l.length?l.map(function(o){return card(o.p,o.i)}).join(''):'<div class="empty">No products found.</div>'}
function toolbar(){
 var cos=[{id:'all',name:'All companies'}].concat(S.cos);
 return '<div class="tb"><div class="seg">'+cos.map(function(c){return '<button class="'+(F.co===c.id?'on':'')+'" data-v="co" data-co="'+esc(c.id)+'">'+esc(c.name)+'</button>'}).join('')+'</div><div class="cats">'+['all'].concat(S.cats).map(function(c){return '<button class="pill '+(F.cat===c?'on':'')+'" data-v="cat" data-cat="'+esc(c)+'">'+(c==='all'?'All products':esc(c))+'</button>'}).join('')+'</div><input id="q" type="search" placeholder="Search products…" value="'+esc(F.q)+'"></div>'}
function refreshCat(){var t=document.getElementById('tbw'),g=document.getElementById('grid');if(t)t.innerHTML=toolbar();if(g)g.innerHTML=gridHTML()}
function pdfCard(p){
 var certs=pcerts(p),links=(p.links||[]).filter(function(l){return l.text});
 return '<div class="pc"><div class="pci">'+im(p.img,p.name)+'</div><div><div class="cobs">'+pcos(p).map(badge).join('')+'</div><h4>'+esc(p.name)+'</h4>'+(p.tags?'<p><b>'+esc(p.tags)+'</b></p>':'')+(p.desc?'<p>'+esc(p.desc)+'</p>':'')+(certs.length?'<div class="logos">'+certs.map(logoLink).join('')+'</div>':'')+(links.length?'<div class="chips">'+links.map(function(l){var u=safeUrl(l.url);return u?'<a class="chip" href="'+esc(u)+'">'+esc(l.text)+'</a>':'<span class="chip">'+esc(l.text)+'</span>'}).join('')+'</div>':'')+'</div></div>'}
function pdfHTML(){
 var cats=S.cats.slice();S.products.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat)});
 return '<div class="pdfview wrap">'+cats.map(function(c){var l=S.products.filter(function(p){return p.cat===c});
  return l.length?'<h2 class="cat">'+esc(c)+'</h2><div class="pdfgrid">'+l.map(pdfCard).join('')+'</div>':''}).join('')+'</div>'}
function renderCatalog(){
 var s=S,names=s.cos.map(function(c){return c.name}).join(' and ');
 var bg=s.bg?'background-image:linear-gradient(135deg,rgba(10,60,22,.88),rgba(30,110,40,.7),rgba(234,88,12,.5)),url(&quot;'+esc(s.bg)+'&quot;)':'';
 var h='<header class="hero '+(editing?'editable':'')+'" '+(editing?'data-e="hero" ':'')+'style="'+bg+'"><div class="wrap"><span class="eyebrow">'+esc(s.eyebrow)+'</span><h1>'+esc(s.title)+'</h1><p class="sub">'+esc(s.subtitle)+'</p><div class="cocards">';
 s.cos.forEach(function(c,ci){
