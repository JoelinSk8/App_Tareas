<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Mis Tareas</title>
</head>
<body>
  <main>
    <header>
      <h1>Mis Tareas</h1>
      <button id="notif-btn" type="button">🔔 Activar notificaciones</button>
    </header>
    <p id="notif-msg" class="hint" hidden></p>

    <form id="task-form">
      <input id="title" placeholder="Nueva tarea…" required maxlength="200" autocomplete="off">
      <input id="due" type="datetime-local" title="Fecha y hora de la tarea">
      <select id="remind" title="Avisarme antes">
        <option value="0">Avisar a la hora</option>
        <option value="5">5 min antes</option>
        <option value="10">10 min antes</option>
        <option value="15">15 min antes</option>
        <option value="30">30 min antes</option>
        <option value="60">1 hora antes</option>
        <option value="1440">1 día antes</option>
      </select>
      <button type="submit">Añadir</button>
    </form>

    <nav id="filters">
      <button data-f="pending" class="active">Pendientes</button>
      <button data-f="done">Hechas</button>
      <button data-f="all">Todas</button>
    </nav>

    <ul id="list"></ul>
    <p id="empty" class="hint" hidden>No hay tareas.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
